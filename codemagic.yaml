workflows:
  ios-mirador-build:
    name: Mirador iOS SwiftUI Build
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      groups:
        - supabase_config
      vars:
        XCODE_PROJECT: "Mirador.xcodeproj"
        XCODE_SCHEME: "MiradorIOS"
        BUNDLE_ID: "com.mirador.heritage.ios"
      xcode: latest
    scripts:
      - name: Inject Supabase credentials into Info.plist
        script: |
          if [ -n "${SUPABASE_URL:-}" ]; then
            /usr/libexec/PlistBuddy -c "Set :SUPABASE_URL ${SUPABASE_URL}" Info.plist || /usr/libexec/PlistBuddy -c "Add :SUPABASE_URL string ${SUPABASE_URL}" Info.plist
          fi
          if [ -n "${SUPABASE_ANON_KEY:-}" ]; then
            /usr/libexec/PlistBuddy -c "Set :SUPABASE_ANON_KEY ${SUPABASE_ANON_KEY}" Info.plist || /usr/libexec/PlistBuddy -c "Add :SUPABASE_ANON_KEY string ${SUPABASE_ANON_KEY}" Info.plist
          fi
      - name: Build for iOS Simulator (compile check without Apple signing)
        script: |
          xcodebuild             -project "$XCODE_PROJECT"             -scheme "$XCODE_SCHEME"             -sdk iphonesimulator             -destination "generic/platform=iOS Simulator"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             build
    artifacts:
      - build/ios/iphonesimulator/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*
